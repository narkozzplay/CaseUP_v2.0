name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: caseup
          POSTGRES_PASSWORD: caseup
          POSTGRES_DB: caseup_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caseup -d caseup_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DJANGO_SETTINGS_MODULE: config.settings.testing
      TEST_DB_ENGINE: postgres
      TEST_POSTGRES_HOST: 127.0.0.1
      TEST_POSTGRES_PORT: "5432"
      TEST_POSTGRES_DB: caseup_test
      TEST_POSTGRES_USER: caseup
      TEST_POSTGRES_PASSWORD: caseup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Run tests
        run: python manage.py test --noinput --parallel 2

  checks:
    name: Lint, deploy check, audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt ruff pip-audit
      - name: Ruff (syntax errors and undefined names)
        run: ruff check --select E9,F63,F7,F82 .
      - name: Production settings pass check --deploy
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: ci-only-not-a-secret-0123456789-abcdefghijklmnopqrstuvwxyz
          DJANGO_ALLOWED_HOSTS: example.com
          # CI-only Fernet key; protects nothing, just satisfies the deploy check.
          FIELD_ENCRYPTION_KEYS: 9ieEJei-bl9MhKen5IyFGe__2iZY-zj_tYn2-kaqquQ=
        run: python manage.py check --deploy --fail-level WARNING
      - name: Compose files render (prod must not publish dev ports)
        run: |
          cp .env.prod.example .env.prod
          docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml config --quiet
          cp .env.dev.example .env.dev
          docker compose --env-file .env.dev config --quiet
      - name: Dependency vulnerabilities
        run: pip-audit -r requirements.txt

  docker-image:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t caseup:ci .
      - name: Runtime tools are present
        run: docker run --rm --entrypoint sh caseup:ci -c "id -un && pg_dump --version && command -v nc && gunicorn --version"
      - name: Django check inside the image
        run: docker run --rm -e DJANGO_SETTINGS_MODULE=config.settings.testing caseup:ci python manage.py check
      - name: collectstatic with prod settings as the image user
        run: >-
          docker run --rm
          -e DJANGO_SETTINGS_MODULE=config.settings.prod
          -e DJANGO_SECRET_KEY=ci-only-not-a-secret-0123456789-abcdefghijklmnopqrstuvwxyz
          -e DJANGO_ALLOWED_HOSTS=example.com
          -e FIELD_ENCRYPTION_KEYS=9ieEJei-bl9MhKen5IyFGe__2iZY-zj_tYn2-kaqquQ=
          caseup:ci python manage.py collectstatic --noinput
