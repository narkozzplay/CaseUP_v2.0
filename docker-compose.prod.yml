name: ${COMPOSE_PROJECT_NAME:-caseup_prod}

services:
  web:
    env_file:
      - ${APP_ENV_FILE:-.env.prod}
    environment:
      DJANGO_HEALTHCHECK_HOST: ${DJANGO_HEALTHCHECK_HOST:-example.com}
      DJANGO_SETTINGS_MODULE: config.settings.prod
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-1}
      RUN_COLLECTSTATIC: ${RUN_COLLECTSTATIC:-1}
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers ${WEB_CONCURRENCY:-2} --timeout ${GUNICORN_TIMEOUT:-120}
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
      - backup_data:/app/backups
    ports:
      - "127.0.0.1:18001:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import os, urllib.request;
          host=os.getenv('DJANGO_HEALTHCHECK_HOST','example.com');
          req=urllib.request.Request('http://127.0.0.1:8000/health/', headers={'Host': host, 'X-Forwarded-Proto': 'https'});
          urllib.request.urlopen(req, timeout=5).read()"

  celery_worker:
    depends_on:
      web:
        condition: service_healthy
    env_file:
      - ${APP_ENV_FILE:-.env.prod}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
      - backup_data:/app/backups
      - server_stats:/app/var/server_stats:ro

  celery_beat:
    depends_on:
      web:
        condition: service_healthy
    env_file:
      - ${APP_ENV_FILE:-.env.prod}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
      - celerybeat_data:/var/run/celery

  telegram_poller:
    depends_on:
      web:
        condition: service_healthy
    env_file:
      - ${APP_ENV_FILE:-.env.prod}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod

  # Public entry point: HTTPS (Let's Encrypt, renewed automatically), www → apex redirect, /media/.
  # Only Caddy listens on the internet; Postgres/Redis stay internal, web is also on 127.0.0.1:18001.
  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    depends_on:
      - web
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:-example.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - media_data:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config

  # Docker containers for Control Center → «Сервер»: once a minute `docker ps` / `docker stats` into a volume
  # the worker reads. The docker socket stays here, in a container without network, never in the site itself.
  container_stats:
    image: docker:27-cli
    restart: unless-stopped
    network_mode: none
    mem_limit: 64m
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - server_stats:/stats
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        while true; do
        docker ps -a --format '{{json .}}' > /stats/ps.tmp && mv /stats/ps.tmp /stats/ps.jsonl;
        docker stats --no-stream --format '{{json .}}' > /stats/stats.tmp && mv /stats/stats.tmp /stats/stats.jsonl;
        sleep 60;
        done

volumes:
  server_stats:
  caddy_data:
  caddy_config:
