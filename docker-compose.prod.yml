name: ${COMPOSE_PROJECT_NAME:-caseup_prod}

services:
  web:
    env_file:
      - ${APP_ENV_FILE:-.env.prod}
    environment:
      DJANGO_HEALTHCHECK_HOST: ${DJANGO_HEALTHCHECK_HOST:-example.com}
      DJANGO_SETTINGS_MODULE: config.settings.prod
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-1}
      RUN_COLLECTSTATIC: ${RUN_COLLECTSTATIC:-1}
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers ${WEB_CONCURRENCY:-2} --timeout ${GUNICORN_TIMEOUT:-120}
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
      - backup_data:/app/backups
    ports:
      - "127.0.0.1:18001:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import os, urllib.request;
          host=os.getenv('DJANGO_HEALTHCHECK_HOST','example.com');
          req=urllib.request.Request('http://127.0.0.1:8000/health/', headers={'Host': host, 'X-Forwarded-Proto': 'https'});
          urllib.request.urlopen(req, timeout=5).read()"

  celery_worker:
    depends_on:
      web:
        condition: service_healthy
    env_file:
      - ${APP_ENV_FILE:-.env.prod}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles

  celery_beat:
    depends_on:
      web:
        condition: service_healthy
    env_file:
      - ${APP_ENV_FILE:-.env.prod}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
      - celerybeat_data:/var/run/celery
