name: ${COMPOSE_PROJECT_NAME:-caseup_dev}

# Общая часть для dev и prod. Здесь нет опубликованных портов и bind-mount исходников:
# Compose складывает списки ports/volumes из всех -f файлов, поэтому то, что объявлено
# здесь, невозможно убрать в prod overlay.
# - dev: docker-compose.override.yml (подхватывается автоматически без флагов -f);
# - prod: docker-compose.prod.yml (только 127.0.0.1:18001 за reverse proxy).

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-caseup_dev}
      POSTGRES_USER: ${POSTGRES_USER:-caseup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-caseup}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-caseup} -d ${POSTGRES_DB:-caseup_dev}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ${APP_ENV_FILE:-.env.dev}
    environment:
      DJANGO_HEALTHCHECK_HOST: ${DJANGO_HEALTHCHECK_HOST:-127.0.0.1}
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.dev}
      DB_ENGINE: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-caseup_dev}
      POSTGRES_USER: ${POSTGRES_USER:-caseup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-caseup}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      DJANGO_CACHE_URL: ${DJANGO_CACHE_URL:-redis://redis:6379/1}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-1}
      RUN_COLLECTSTATIC: ${RUN_COLLECTSTATIC:-1}
    command: ${WEB_COMMAND:-python manage.py runserver 0.0.0.0:8000}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import os, urllib.request;
          host=os.getenv('DJANGO_HEALTHCHECK_HOST','127.0.0.1');
          req=urllib.request.Request('http://127.0.0.1:8000/health/', headers={'Host': host});
          urllib.request.urlopen(req, timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
      - backup_data:/app/backups
      - geoip_data:/app/var/geoip

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    env_file:
      - ${APP_ENV_FILE:-.env.dev}
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.dev}
      DB_ENGINE: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-caseup_dev}
      POSTGRES_USER: ${POSTGRES_USER:-caseup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-caseup}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      DJANGO_CACHE_URL: ${DJANGO_CACHE_URL:-redis://redis:6379/1}
      RUN_MIGRATIONS: "0"
      RUN_COLLECTSTATIC: "0"
    command: celery -A config worker -l info --concurrency=${CELERY_WORKER_CONCURRENCY:-2} --max-tasks-per-child=100
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
      - geoip_data:/app/var/geoip
      - backup_data:/app/backups
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    env_file:
      - ${APP_ENV_FILE:-.env.dev}
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.dev}
      DB_ENGINE: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-caseup_dev}
      POSTGRES_USER: ${POSTGRES_USER:-caseup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-caseup}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      DJANGO_CACHE_URL: ${DJANGO_CACHE_URL:-redis://redis:6379/1}
      RUN_MIGRATIONS: "0"
      RUN_COLLECTSTATIC: "0"
    command: celery -A config beat -l info --schedule /var/run/celery/celerybeat-schedule
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
      - celerybeat_data:/var/run/celery
    healthcheck:
      test: ["CMD", "python", "deploy/beat_healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Telegram bot updates (/start linking) in «Опрос» mode: the site asks Telegram itself, through the relay.
  # Idles when the bot is off or works in webhook mode.
  telegram_poller:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    env_file:
      - ${APP_ENV_FILE:-.env.dev}
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.dev}
      DB_ENGINE: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-caseup_dev}
      POSTGRES_USER: ${POSTGRES_USER:-caseup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-caseup}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      DJANGO_CACHE_URL: ${DJANGO_CACHE_URL:-redis://redis:6379/1}
      RUN_MIGRATIONS: "0"
      RUN_COLLECTSTATIC: "0"
    command: python manage.py telegram_poll
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/telegram_poll.alive) )) -lt 180"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
  celerybeat_data:
  backup_data:
  geoip_data:
