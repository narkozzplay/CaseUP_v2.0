{% if metrika_id %}
<script>
    (function (m, e, t, r, i, k, a) {
        m[i] = m[i] || function () { (m[i].a = m[i].a || []).push(arguments); };
        m[i].l = 1 * new Date();
        for (var j = 0; j < document.scripts.length; j++) { if (document.scripts[j].src === r) { return; } }
        k = e.createElement(t), a = e.getElementsByTagName(t)[0], k.async = 1, k.src = r, a.parentNode.insertBefore(k, a);
    })(window, document, 'script', 'https://mc.yandex.ru/metrika/tag.js', 'ym');
    ym({{ metrika_id }}, 'init', { clickmap: true, trackLinks: true, accurateTrackBounce: true, webvisor: true });
    (function () {
        // The dashboard swaps page content without a reload; count each new address as a page view.
        var lastUrl = window.location.href;
        document.addEventListener('dashboard:content-replaced', function () {
            var url = window.location.href;
            if (url === lastUrl) return;
            ym({{ metrika_id }}, 'hit', url, { title: document.title, referer: lastUrl });
            lastUrl = url;
        });
    })();
