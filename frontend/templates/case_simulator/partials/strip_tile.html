<div class="sim-tile rarity--{{ tile.rarity }}">
    <div class="sim-tile__media">{% if tile.image %}<img src="{{ tile.image }}" alt="" loading="lazy" onerror="this.remove()">{% endif %}</div>
    <span class="sim-tile__weapon">{{ tile.weapon }}</span>
    <strong class="sim-tile__name">{{ tile.skin }}</strong>
</div>
