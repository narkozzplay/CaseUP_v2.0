<article class="pcz-card pcz-card--bg{% if item.pk == selected_bg_id and not hidden_item %} is-current{% endif %}{% if hidden_item %} is-hidden{% endif %}"
         data-pcz-item data-state="{% if can_customize %}open{% else %}pro{% endif %}" data-kind="bg" data-title="{{ item.title|lower }}"
         data-static="{{ item.static_url }}" data-video="{{ item.video_url }}" data-name="{{ item.title }}"
         {% if not hidden_item %}data-select-url="{% url 'profile_customization:select_background' item.pk %}"{% endif %}>
    <button type="button" class="pcz-card__media" data-pcz-preview aria-label="{% if LANGUAGE_CODE == "ru" %}Примерить{% else %}Try on{% endif %}: {{ item.title }}">
        <img src="{{ item.static_url }}" alt="" loading="lazy">
        {% if item.video_url %}<video muted loop playsinline preload="none" src="{{ item.video_url }}" data-pcz-hover-video></video>{% endif %}
        <span class="pcz-card__flags">
            {% if item.pk == selected_bg_id and not hidden_item %}<span class="pcz-flag pcz-flag--current">{% if LANGUAGE_CODE == "ru" %}Установлен{% else %}Current{% endif %}</span>{% endif %}
            {% if item.video_url %}<span class="pcz-flag">{% if LANGUAGE_CODE == "ru" %}Анимация{% else %}Animated{% endif %}</span>{% endif %}
            {% if hidden_item %}<span class="pcz-flag">{% if LANGUAGE_CODE == "ru" %}Фон{% else %}Background{% endif %}</span>{% endif %}
        </span>
        <span class="pcz-card__hint">{% if LANGUAGE_CODE == "ru" %}Примерить{% else %}Try on{% endif %}</span>
    </button>
    <div class="pcz-card__foot">
        <div class="pcz-card__text">
            <strong class="pcz-card__title">{{ item.title }}</strong>
            {% if item.source_item_id %}<span class="pcz-card__meta">Steam item #{{ item.source_item_id }}</span>{% endif %}
        </div>
        {% include "profile_customization/partials/_card_actions.html" with kind="background" %}
    </div>
</article>
