<form method="post" action="{% url 'social_friends:accept_friend_request' row.request_id %}" class="inline-form">
    {% csrf_token %}
    <input type="hidden" name="next" value="{% url 'social_friends:friend_requests' %}">
    <button type="submit" class="btn btn-primary btn-sm">{% if LANGUAGE_CODE == "ru" %}Принять{% else %}Accept{% endif %}</button>
</form>
<form method="post" action="{% url 'social_friends:decline_friend_request' row.request_id %}" class="inline-form">
    {% csrf_token %}
    <input type="hidden" name="next" value="{% url 'social_friends:friend_requests' %}">
    <button type="submit" class="btn btn-secondary btn-sm">{% if LANGUAGE_CODE == "ru" %}Отклонить{% else %}Decline{% endif %}</button>
</form>
