<div class="form-field alert-form__field{% if extra_class %} {{ extra_class }}{% endif %}">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}<small class="alert-form__help">{{ field.help_text }}</small>{% endif %}
    {% for error in field.errors %}<div class="faceit-error">{{ error }}</div>{% endfor %}
</div>
