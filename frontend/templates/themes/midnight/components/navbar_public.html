{% load i18n %}
<header class="site-header">
    <div class="container navbar">
        <a class="brand" href="/">{{ site_settings.site_name|default:"CaseUP" }} · Midnight</a>
        <nav class="nav-links">
            <a href="/">{% trans "Home" %}</a>
            <a href="/dashboard-preview/">{% trans "Dashboard" %}</a>
            <a href="/pricing/">{% trans "Pricing" %}</a>
        </nav>
        <div class="nav-links nav-links--auth">
            {% if request.user.is_authenticated %}
                <a class="btn btn-secondary btn-sm" href="/profile/">{% trans "Profile" %}</a>
            {% else %}
                <a class="btn btn-secondary btn-sm" href="/auth/login/">{% trans "Sign in" %}</a>
            {% endif %}
        </div>
    </div>
</header>
