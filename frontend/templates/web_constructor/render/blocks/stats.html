<div class="wc-section-head">
    <h2 class="wc-block-title">{{ block.data.title }}</h2>
</div>
<div class="wc-stat-grid wc-stat-grid--{{ block.style.columns|default:'3' }}">
    {% for item in block.data.items %}
        <article class="wc-stat-card">
            <strong>{{ item.value }}</strong>
            <span>{{ item.label }}</span>
            {% if item.description %}<small>{{ item.description }}</small>{% endif %}
        </article>
    {% endfor %}
</div>
