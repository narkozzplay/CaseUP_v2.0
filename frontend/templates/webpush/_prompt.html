<aside class="push-prompt" data-push-prompt hidden aria-live="polite">
    <span class="push-prompt__icon" aria-hidden="true">🔔</span>
    <div class="push-prompt__text">
        <strong>Включить уведомления?</strong>
        <p data-push-prompt-text>{{ push_prompt.text }}</p>
        <p class="push-prompt__ios" data-push-prompt-ios hidden>На iPhone уведомления работают, когда сайт установлен на экран «Домой»: нажмите «Поделиться» <span aria-hidden="true">⎋</span> → «На экран „Домой“», откройте CaseUP с иконки и включите уведомления.</p>
    </div>
    <div class="push-prompt__actions">
        <button type="button" class="btn btn-primary btn-sm" data-push-enable>Включить</button>
        <button type="button" class="btn btn-ghost btn-sm" data-push-dismiss>Не сейчас</button>
    </div>
</aside>
